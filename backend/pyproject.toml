[project]
name = "herlog-api"
version = "1.0.0"
description = "她记 · 女性健康记录助手 —— 比赛分支后端"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0",
    "pymysql>=1.1",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "bcrypt>=4.1",
    "redis>=5.0",
    "httpx>=0.27",
    "pillow>=10.3",
    "tzdata>=2024.1",
]

[dependency-groups]
dev = ["pytest>=8.2"]

[project.optional-dependencies]
sms = ["alibabacloud_dysmsapi20170525>=4.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["error::DeprecationWarning:app.*"]
