<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>她记 · 登录</title>
<link rel="stylesheet" href="../前端样式/styles.css">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="business.css">
<script>if(self!==top){document.documentElement.className+=' embed';}</script>
</head>
<body class="auth">
<div class="screen">
  <header class="hero auth-hero">
    <img class="auth-logo" src="assets/app-icon.svg" alt="她记">
    <div class="auth-title">欢迎回来</div>
    <div class="auth-sub">用账号继续记录今天</div>
  </header>

  <main class="main">
    <div class="card auth-card">
      <div class="field" style="margin-top:0">
          <label>用户名</label>
          <div class="control">lin_xiaoyu</div>
        </div>
        <div class="field">
          <label>密码</label>
          <div class="control" style="justify-content:space-between">
            <span>••••••••</span>
            <span style="font-size:12px;color:#C0566B">显示</span>
          </div>
        </div>
      <button class="btn block" style="margin-top:20px">登录</button>
      <div class="auth-note">登录后才能查看你的记录；退出登录不会删除数据。</div>
    </div>
    <div class="auth-foot">还没有账号？<a href="register.html">注册</a></div>
  </main>
  <img class="auth-art" src="assets/bloom.png" alt="">
</div>
</body>
</html>
