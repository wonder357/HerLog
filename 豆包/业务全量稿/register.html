<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>她记 · 注册</title>
<link rel="stylesheet" href="../前端样式/styles.css">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="business.css">
<script>if(self!==top){document.documentElement.className+=' embed';}</script>
</head>
<body class="auth register">
<div class="screen">
  <header class="hero auth-hero">
    <img class="auth-logo" src="assets/app-icon.svg" alt="她记">
    <div class="auth-title">创建账号</div>
    <div class="auth-sub">记录只属于这个账号</div>
  </header>

  <main class="main">
    <div class="card auth-card">
      <div class="field" style="margin-top:0">
          <label>用户名</label>
          <div class="control">lin_xiaoyu</div>
          <div class="hint">4–20 位字母、数字或下划线；注册后不可修改。</div>
        </div>
        <div class="field">
          <label>密码</label>
          <div class="control">••••••••</div>
        </div>
        <div class="field">
          <label>确认密码</label>
          <div class="control">••••••••</div>
          <div class="hint">两次输入需一致。</div>
        </div>
      <button class="btn block" style="margin-top:20px">注册</button>
      <div class="auth-note">注册成功后将返回登录页，不会自动登录。</div>
    </div>
    <div class="auth-foot">已有账号？<a href="login.html">登录</a></div>
  </main>
  <img class="auth-art" src="assets/bloom.png" alt="">
</div>
</body>
</html>
