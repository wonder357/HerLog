<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>她记 · 皮肤</title>
<link rel="stylesheet" href="../../前端样式/styles.css">
<link rel="stylesheet" href="theme.css">
<script>if(self!==top){document.documentElement.className+=' embed';}</script></head>
<body>
<div class="screen">

  <header class="hero">
    <h1>皮肤</h1>
    <div class="hero-sub">拍照观察，记录同一部位的变化</div>
  </header>

  <main class="main">

    <section class="section" style="margin-top:6px">
      <div class="card">
        <button class="btn block">拍照分析</button>
        <div class="note" style="margin-top:10px">
          照片会在你确认后发送至模型服务，仅用于本次观察；不保存或重拍不会新增记录。
        </div>
      </div>
    </section>

    <section class="section">
      <div class="section-head">
        <h2 class="h2">最近一次观察</h2>
        <a class="link" href="#">历史记录
          <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="#A5583A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3.5 10.5 8 6 12.5"/></svg>
        </a>
      </div>

      <div class="card">
        <div class="observation-head">
          <div class="photo">
            <svg class="ph-glyph" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="rgba(122,78,88,.42)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3.2" y="6.2" width="17.6" height="13.6" rx="3"/>
              <circle cx="12" cy="13" r="3.9"/>
              <path d="M8.4 6.2 9.6 4.2h4.8l1.2 2"/>
            </svg>
            <span class="ph-label">面部 · 左颊</span>
          </div>
          <div class="info">
            <div class="meta">11 月 16 日 21:04</div>
            <div style="display:flex;gap:6px;margin-top:8px;flex-wrap:wrap">
              <span class="tag">AI 观察</span>
              <span class="tag plain">已保存</span>
            </div>
            <div class="meta" style="margin-top:8px">照片仅本人可见</div>
          </div>
        </div>

        <div class="obs-sections">
          <div class="obs-block">
            <div class="k">照片中可见</div>
            <div class="v">左颊有一处淡红色区域，边界较柔和，附近皮肤平整。</div>
          </div>
          <div class="obs-block">
            <div class="k">看不清的地方</div>
            <div class="v">拍摄时光线偏暗，毛孔与细纹的细节不容易分辨。</div>
          </div>
          <div class="obs-block">
            <div class="k">下次可留意</div>
            <div class="v">在自然光下、同一角度再拍一张，方便和这次对照。</div>
          </div>
        </div>

        <div class="note" style="margin-top:12px">
          以上为模型生成的观察文字，不构成诊断；某次未提及一种现象，不代表它不存在。
        </div>
      </div>
    </section>

  </main>

  <nav class="tabbar">
    <a class="tab" href="home.html">
      <span class="tab-ic"><img src="icons/home.svg" alt=""></span>
      <span class="tab-label">首页</span>
    </a>
    <a class="tab" href="period.html">
      <span class="tab-ic"><img src="icons/period.svg" alt=""></span>
      <span class="tab-label">经期</span>
    </a>
    <a class="tab" href="weight.html">
      <span class="tab-ic"><img src="icons/weight.svg" alt=""></span>
      <span class="tab-label">体重</span>
    </a>
    <a class="tab on" href="skin.html">
      <span class="tab-ic"><img src="icons/skin-active.svg" alt=""></span>
      <span class="tab-label">皮肤</span>
    </a>
    <a class="tab" href="me.html">
      <span class="tab-ic"><img src="icons/me.svg" alt=""></span>
      <span class="tab-label">我的</span>
    </a>
  </nav>

</div>
</body>
</html>
