<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-labelledby="m-title m-desc">
  <title id="m-title">她记 · 小胭（主形象）</title>
  <desc id="m-desc">纸页精灵「小胭」：一张折起一角的粉色记事纸，肩头一支胭脂花，胸前一颗记录心。</desc>
  <g id="m-rou" stroke-linejoin="round" stroke-linecap="round">
    <!-- 脚 -->
    <ellipse cx="430" cy="732" rx="50" ry="28" fill="#F9DEE4" stroke="#4A2331" stroke-width="10"/>
    <ellipse cx="594" cy="732" rx="50" ry="28" fill="#F9DEE4" stroke="#4A2331" stroke-width="10"/>
    <!-- 手臂 -->
    <path d="M 348 566 C 302 580 270 604 256 630" fill="none" stroke="#4A2331" stroke-width="58"/>
    <path d="M 676 548 C 720 538 752 508 762 478" fill="none" stroke="#4A2331" stroke-width="58"/>
    <path d="M 348 566 C 302 580 270 604 256 630" fill="none" stroke="#F9DEE4" stroke-width="40"/>
    <path d="M 676 548 C 720 538 752 508 762 478" fill="none" stroke="#F9DEE4" stroke-width="40"/>
    <!-- 身体：折起一角的记事纸 -->
    <path d="M 492 330 H 592 L 702 440 V 640 A 90 90 0 0 1 612 730 H 412 A 90 90 0 0 1 322 640 V 500 A 170 170 0 0 1 492 330 Z" fill="#F9DEE4" stroke="#4A2331" stroke-width="10"/>
    <path d="M 592 330 L 702 440 L 592 440 Z" fill="#E9A6BA" stroke="#4A2331" stroke-width="10"/>
    <!-- 肩上胭脂花 -->
    <g transform="translate(470,350)">
      <g transform="rotate(-52)"><ellipse cx="0" cy="-44" rx="26" ry="46" fill="#EEA9BD" stroke="#4A2331" stroke-width="10"/></g>
      <g transform="rotate(26)"><ellipse cx="0" cy="-42" rx="25" ry="44" fill="#EEA9BD" stroke="#4A2331" stroke-width="10"/></g>
      <g transform="rotate(-12)"><ellipse cx="0" cy="-54" rx="29" ry="54" fill="#F5C8D4" stroke="#4A2331" stroke-width="10"/></g>
      <circle cx="6" cy="-56" r="11" fill="#B23A55"/>
    </g>
    <!-- 胭脂 -->
    <ellipse cx="396" cy="536" rx="29" ry="17" fill="#EF9FB2"/>
    <ellipse cx="628" cy="536" rx="27" ry="16" fill="#EF9FB2"/>
    <!-- 记录心 -->
    <path d="M 512 700 C 478 678 466 656 466 636 C 466 619 479 610 493 612 C 502 613 509 619 512 626 C 515 619 522 613 531 612 C 545 610 558 619 558 636 C 558 656 546 678 512 700 Z" fill="#C1445E" stroke="#4A2331" stroke-width="9"/>
    <!-- 眼 -->
    <ellipse cx="452" cy="498" rx="15" ry="19" fill="#3B1B28"/>
    <ellipse cx="572" cy="498" rx="15" ry="19" fill="#3B1B28"/>
    <circle cx="457" cy="490" r="5" fill="#FFF7F5"/>
    <circle cx="577" cy="490" r="5" fill="#FFF7F5"/>
    <!-- 嘴 -->
    <path d="M 494 546 Q 512 568 530 546" fill="none" stroke="#3B1B28" stroke-width="9"/>
  </g>
</svg>
