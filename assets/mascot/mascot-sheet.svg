  <text x="96" y="150" font-family="SimSun, Songti SC, Source Han Serif SC, Georgia, serif" font-size="54" fill="#2B2229">她记</text>
  <text x="262" y="150" font-family="Microsoft YaHei, PingFang SC, Helvetica, sans-serif" font-size="22" fill="#6B5F66">小胭 · 卡通形象设定</text>
  <text x="1504" y="150" text-anchor="end" font-family="Microsoft YaHei, PingFang SC, Helvetica, sans-serif" font-size="13" fill="#9A8E93">V1.0 · 2026-11-19</text>
  <text x="96" y="196" font-family="Microsoft YaHei, PingFang SC, Helvetica, sans-serif" font-size="15" fill="#6B5F66">一张会替你记住事情的纸。她身上的每一处，都来自产品里已经存在的东西。</text>
