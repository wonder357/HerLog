      <g transform="rotate(-12)"><ellipse cx="0" cy="-54" rx="29" ry="54" fill="#F5C8D4" stroke="#4A2331" stroke-width="10"/></g>
      <circle cx="6" cy="-56" r="11" fill="#B23A55"/>
