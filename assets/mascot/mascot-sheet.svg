  <desc id="m-desc">纸页精灵「小胭」：一张折起一角的粉色记事纸，肩头一支胭脂花，胸前一颗记录心。</desc>
  <g id="m-rou" stroke-linejoin="round" stroke-linecap="round">
    <!-- 脚 -->
